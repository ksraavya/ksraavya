name: Generate Activity Graph

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch activity graph SVG
        run: |
          mkdir -p dist
          curl -s "https://github-readme-activity-graph.vercel.app/graph?username=ksraavya&theme=react-dark&hide_border=true&area=true&area_color=6E40C9&line=6E40C9&point=ffffff&custom_title=Sraavya%27s%20Contribution%20Graph" -o dist/activity-graph.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/activity-graph.svg
          git diff --staged --quiet || git commit -m "chore: update activity graph"
          git push
