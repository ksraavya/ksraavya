name: Generate Activity Graph

on:
  schedule:
    - cron: '0 1 * * *'   # runs daily at 1:00 AM UTC
  workflow_dispatch:        # lets you trigger it manually too

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate activity graph
        uses: Ashutosh00710/github-readme-activity-graph@v1.2.1
        with:
          username: ksraavya
          theme: react-dark
          hide_border: true
          area: true
          area_color: 6E40C9
          line: 6E40C9
          point: ffffff
          custom_title: "Sraavya's Contribution Graph"
          output_file: dist/activity-graph.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p dist
          git add dist/activity-graph.svg
          git diff --staged --quiet || git commit -m "chore: update activity graph"
          git push
